[build]
# Cambia el target según tu núcleo real:
#   thumbv6m-none-eabi   -> Cortex-M0 / M0+ / M1
#   thumbv7m-none-eabi   -> Cortex-M3
#   thumbv7em-none-eabi  -> Cortex-M4 / M7 sin FPU
#   thumbv7em-none-eabihf-> Cortex-M4F / M7F con FPU
target = "thumbv7em-none-eabihf"

[target.thumbv7em-none-eabihf]
runner = "probe-rs run --chip STM32F407VGTx"  # ajusta a tu chip real
rustflags = [
  "-C", "link-arg=-Tlink.x",
]

[env]
DEFMT_LOG = "info"
